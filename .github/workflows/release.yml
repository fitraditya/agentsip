name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: false

permissions:
  contents: write

jobs:
  backend-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.ref_name }}" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build backend binaries
        working-directory: backend
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p ../dist
          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              echo "Building engine ${GOOS}/${GOARCH}..."
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath \
                -ldflags "-s -w -X main.buildVersion=${VERSION}" \
                -o "../dist/agentsip-${VERSION}-${GOOS}-${GOARCH}/engine" ./cmd/engine
            done
          done

      - name: Package artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for dir in dist/agentsip-${VERSION}-*; do
            cp -r backend/db/migrations "$dir/"
            cp -r backend/db/migrations_vectorstore "$dir/"
            tar -czf "${dir}.tar.gz" -C dist "$(basename "$dir")"
            rm -rf "$dir"
          done
          cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  frontend-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'agentsip' }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
